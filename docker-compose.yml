services:
  ms-calculo-impuestos:
    # Build: usa el Dockerfile del directorio actual
    build:
      context: .
      dockerfile: Dockerfile

    # Nombre del contenedor interno
    container_name: ms-calculo-impuestos

    # Reiniciar siempre si falla
    restart: always

    environment:
      - SERVER_PORT=8080
      - SPRING_PROFILES_ACTIVE=dev
      # Conexión DB
      - URL_BD_IMPUESTOS=${URL_BD_IMPUESTOS}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      # Seguridad Keycloak
      - ISSUER_URI_KEYCLOACK=${ISSUER_URI_KEYCLOACK}
      - JWK_SET_URI_KEYCLOACK${JWK_SET_URI_PADRON}

    # Configuración de red (opcional, pero buena práctica)
    networks:
      - siim-network

# Definimos la red
networks:
  siim-network:
    name: siim-global-net
    external: true