services:
  ms-calculo-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ms-calculo-app
    restart: always
    ports:
      - "8082:8080"

    environment:
      - SERVER_PORT=8080
      - SPRING_PROFILES_ACTIVE=${PROFILE_SPRING}
      - URL_BD_IMPUESTOS=${URL_BD_IMPUESTOS}
      - POSTGRES_USER=${USER_NAME_BD}
      - POSTGRES_PASSWORD=${PASSWORD_BD}
      - ISSUER_URI_KEYCLOAK=${ISSUER_URI_KEYCLOAK}
      - JWK_SET_URI_KEYCLOAK=${JWK_SET_URI_KEYCLOAK}

    networks:
      - siim-network

networks:
  siim-network:
    name: siim-global-net
    external: true